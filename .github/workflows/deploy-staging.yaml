name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      hotfix:
        description: "Set to true if deploying a hotfix (reads changed components from Jira)"
        required: false
        type: boolean
        default: false
      jira_issue_key:
        description: "Jira Issue Key (e.g., PROJ-123)"
        required: true
        type: string
  workflow_call:
    inputs:
      hotfix:
        required: false
        type: boolean
        default: false
      jira_issue_key:
        required: true
        type: string

permissions:
  id-token: write   # Required for GitHub OIDC (AWS & HashiCorp Vault)
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: staging-eks-cluster
  K8S_NAMESPACE: staging
  DB_JOB_NAME: db-migrations
  DEV_KUSTOMIZE: k8s/overlays/dev/kustomization.yaml
  STG_KUSTOMIZE: k8s/overlays/staging/kustomization.yaml

jobs:
  # ============================================================
  # STAGE 4: Detect Changed Components (Hotfix via Jira OR Standard Dev vs. Staging)
  # ============================================================
  detect-diff:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.diff.outputs.db_changed }}
      db_tag: ${{ steps.diff.outputs.db_tag }}
      app_components: ${{ steps.diff.outputs.app_components }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Components (Hotfix via Jira or Dev vs. Staging Diff)
        id: diff
        env:
          IS_HOTFIX: ${{ inputs.hotfix }}
          JIRA_KEY: ${{ inputs.jira_issue_key }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          CHANGED_APPS=()

          if [ "$IS_HOTFIX" == "true" ]; then
            echo "Hotfix mode enabled. Fetching changed components from Jira issue: $JIRA_KEY"

            JIRA_JSON=$(curl -sf \
              -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Accept: application/json" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}")

            # Extract Jira Components (lowercased)
            JIRA_COMPONENTS=$(echo "$JIRA_JSON" | jq -r '.fields.components[].name' | tr '[:upper:]' '[:lower:]')
            echo "Jira components found: ${JIRA_COMPONENTS:-none}"

            # 1. Check DB Migrations first (Priority)
            if echo "$JIRA_COMPONENTS" | grep -qE '^(db|db-migrations)$'; then
              DEV_DB=$(yq '.images[] | select(.name == "*db-migrations*") | .newTag' "$DEV_KUSTOMIZE")
              echo "db_changed=true" >> "$GITHUB_OUTPUT"
              echo "db_tag=$DEV_DB" >> "$GITHUB_OUTPUT"
              echo "Hotfix includes DB Migration: $DEV_DB"
            else
              echo "db_changed=false" >> "$GITHUB_OUTPUT"
              echo "db_tag=" >> "$GITHUB_OUTPUT"
            fi

            # 2. Check Application Components (Backend & Frontend)
            for comp in backend frontend; do
              if echo "$JIRA_COMPONENTS" | grep -qx "$comp"; then
                CHANGED_APPS+=("$comp")
                echo "Hotfix includes app component: $comp"
              fi
            done

          else
            echo "Standard mode enabled. Comparing Dev and Staging Kustomize overlays..."

            # 1. Check DB Migrations first (Priority)
            DEV_DB=$(yq '.images[] | select(.name == "*db-migrations*") | .newTag' "$DEV_KUSTOMIZE")
            STG_DB=$(yq '.images[] | select(.name == "*db-migrations*") | .newTag' "$STG_KUSTOMIZE")

            if [ "$DEV_DB" != "$STG_DB" ] && [ -n "$DEV_DB" ]; then
              echo "db_changed=true" >> "$GITHUB_OUTPUT"
              echo "db_tag=$DEV_DB" >> "$GITHUB_OUTPUT"
              echo "DB Migration changed: ${STG_DB:-none} -> $DEV_DB"
            else
              echo "db_changed=false" >> "$GITHUB_OUTPUT"
              echo "db_tag=" >> "$GITHUB_OUTPUT"
            fi

            # 2. Check Application Components (Backend & Frontend)
            for comp in backend frontend; do
              DEV_TAG=$(yq ".images[] | select(.name == \"*$comp*\") | .newTag" "$DEV_KUSTOMIZE")
              STG_TAG=$(yq ".images[] | select(.name == \"*$comp*\") | .newTag" "$STG_KUSTOMIZE")

              if [ "$DEV_TAG" != "$STG_TAG" ] && [ -n "$DEV_TAG" ]; then
                CHANGED_APPS+=("$comp")
                echo "$comp changed: ${STG_TAG:-none} -> $DEV_TAG"
              fi
            done
          fi

          APPS_JSON=$(printf '%s\n' "${CHANGED_APPS[@]}" | jq -R . | jq -s -c 'map(select(length > 0))')
          echo "Target app components: $APPS_JSON"
          echo "app_components=$APPS_JSON" >> "$GITHUB_OUTPUT"

  # ============================================================
  # STAGE 5A: DB Migration (Runs FIRST - Strict Fix-Forward)
  # ============================================================
  deploy-db:
    name: QA Approval & Run DB Migrations
    needs: detect-diff
    if: needs.detect-diff.outputs.db_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve Secrets from HashiCorp Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: github-actions-staging
          secrets: |
            secret/data/staging/app * ;

      - name: Update kubeconfig for Staging EKS
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Run DB Migrations Job
        id: db_migrate
        continue-on-error: true
        run: |
          echo "Running DB migration Job (${{ needs.detect-diff.outputs.db_tag }}) in ${K8S_NAMESPACE}..."
          kubectl delete job "${DB_JOB_NAME}" -n "${K8S_NAMESPACE}" --ignore-not-found=true
          kubectl apply -k k8s/overlays/staging/db-migrations
          kubectl wait --for=condition=complete "job/${DB_JOB_NAME}" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Collect DB Failure Logs
        if: steps.db_migrate.outcome == 'failure'
        run: |
          {
            echo "## Staging Deployment Verdict: \`DB_FAILURE\`"
            echo "**Calculated Rollback Mode:** \`none\`"
            echo "**Root Cause Signal:** DB migration Job failed. App deployment skipped. Halting for Fix-Forward (no DB rollback)."
            echo ""
            echo "### Recent Namespace Events"
            echo '```text'
            kubectl get events -n "$K8S_NAMESPACE" --sort-by='.metadata.creationTimestamp' | tail -n 20 || true
            echo '```'
            echo "### DB Migration Job Logs"
            echo '```text'
            kubectl logs "job/${DB_JOB_NAME}" -n "$K8S_NAMESPACE" --tail=100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Jira (Staging Deployment Failed)
        if: steps.db_migrate.outcome == 'failure'
        uses: ./actions/jira-transition@main
        with:
          jira-base-url: ${{ vars.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          source-text: ${{ inputs.jira_issue_key }}
          target-status: "Staging Deployment Failed"

      - name: Fail Job on DB Migration Failure
        if: steps.db_migrate.outcome == 'failure'
        run: exit 1

  # ============================================================
  # STAGE 5B: Deploy Changed App Components (After DB Migration)
  # ============================================================
  deploy-staging:
    name: QA Approval & Deploy Apps to Staging EKS
    needs: [detect-diff, deploy-db]
    if: |
      always() &&
      needs.detect-diff.result == 'success' &&
      (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped') &&
      needs.detect-diff.outputs.app_components != '[]'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://example.com
    outputs:
      failure_type: ${{ steps.diagnose.outputs.failure_type }}
      rollback_mode: ${{ steps.diagnose.outputs.rollback_mode }}
      failed_component: ${{ steps.deploy.outputs.failed_component }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Retrieve Secrets from HashiCorp Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: github-actions-staging
          secrets: |
            secret/data/staging/app * ;

      - name: Update kubeconfig for Staging EKS
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Deploy Changed Components to Staging EKS
        id: deploy
        continue-on-error: true
        run: |
          COMPONENTS=$(echo '${{ needs.detect-diff.outputs.app_components }}' | jq -r '.[]')

          for COMP in $COMPONENTS; do
            NEW_TAG=$(yq ".images[] | select(.name == \"*$COMP*\") \vert{} .newTag" "$DEV_KUSTOMIZE")
            IMAGE_NAME=$(yq ".images[] | select(.name == \"*$COMP*\") \vert{} .name" "$DEV_KUSTOMIZE")

            echo "Deploying ${COMP} with image ${IMAGE_NAME}:${NEW_TAG}..."
            kubectl set image "deployment/${COMP}" \
              "${COMP}=${IMAGE_NAME}:${NEW_TAG}" \
              -n "${K8S_NAMESPACE}"

            if ! kubectl rollout status "deployment/${COMP}" -n "${K8S_NAMESPACE}" --timeout=300s; then
              echo "failed_component=${COMP}" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          done

      - name: Classify Failure & Collect Debug Logs
        id: diagnose
        if: steps.deploy.outcome == 'failure'
        run: |
          ROLLBACK_MODE="none"
          FAILED_COMP="${{ steps.deploy.outputs.failed_component }}"

          POD_JSON=$(kubectl get pods -n "$K8S_NAMESPACE" -l "app=$FAILED_COMP" --sort-by=.metadata.creationTimestamp -o json | jq '.items[-1]')
          PHASE=$(echo "$POD_JSON" | jq -r '.status.phase // "Unknown"')
          WAIT_REASON=$(echo "$POD_JSON" | jq -r '.status.containerStatuses[0].state.waiting.reason // ""')
          TERM_REASON=$(echo "$POD_JSON" | jq -r '.status.containerStatuses[0].lastState.terminated.reason // ""')
          READY=$(echo "$POD_JSON" | jq -r '.status.containerStatuses[0].ready // false')

          if [ -z "$POD_JSON" ] || [ "$POD_JSON" == "null" ] \vert{}\vert{} [ "$PHASE" == "Pending" ] || [[ "$WAIT_REASON" =~ ^(ImagePullBackOff\vert{}ErrImagePull\vert{}CreateContainerConfigError\vert{}CreateContainerError)$ ]]; then
            FAILURE_TYPE="INFRA_FAILURE"
            REASON="Infrastructure/Cluster issue detected on ${FAILED_COMP} (Phase=$PHASE, Reason=$WAIT_REASON). Rollback skipped."
          else
            FAILURE_TYPE="CODE_FAILURE"
            REASON="Application runtime/probe failure on ${FAILED_COMP} (Phase=$PHASE, Waiting=$WAIT_REASON, Terminated=$TERM_REASON, Ready=$READY)."
            if [ "${{ needs.detect-diff.outputs.db_changed }}" == "true" ]; then
              ROLLBACK_MODE="gated"
            else
              ROLLBACK_MODE="auto"
            fi
          fi

          echo "failure_type=$FAILURE_TYPE" >> "$GITHUB_OUTPUT"
          echo "rollback_mode=$ROLLBACK_MODE" >> "$GITHUB_OUTPUT"

          {
            echo "## Staging Deployment Verdict: \`$FAILURE_TYPE\`"
            echo "**Failed Component:** \`$FAILED_COMP\`"
            echo "**Calculated Rollback Mode:** \`$ROLLBACK_MODE\`"
            echo "**Root Cause Signal:** $REASON"
            echo ""
            echo "### Recent Namespace Events"
            echo '```text'
            kubectl get events -n "$K8S_NAMESPACE" --sort-by='.metadata.creationTimestamp' | tail -n 20 || true
            echo '```'
            echo "### Recent Logs (${FAILED_COMP})"
            echo '```text'
            kubectl logs "deployment/${FAILED_COMP}" -n "$K8S_NAMESPACE" --tail=100 --all-containers=true || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Jira (Staging Deployment Failed)
        if: steps.deploy.outcome == 'failure'
        uses: ./actions/jira-transition@main
        with:
          jira-base-url: ${{ vars.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          source-text: ${{ inputs.jira_issue_key }}
          target-status: "Staging Deployment Failed"

      - name: Fail Job on Deployment Failure
        if: steps.deploy.outcome == 'failure'
        run: exit 1

      - name: Update Jira (Staging Deployment Success)
        if: steps.deploy.outcome == 'success'
        uses: ./actions/jira-transition@main
        with:
          jira-base-url: ${{ vars.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          source-text: ${{ inputs.jira_issue_key }}
          target-status: "Staging Deployment Success"

  # ============================================================
  # STAGE 6: Run Staging Tests & Promotion Gate
  # ============================================================
  staging-tests:
    name: Run Staging Test Suite
    needs: [detect-diff, deploy-db, deploy-staging]
    if: |
      always() &&
      needs.detect-diff.result == 'success' &&
      (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped') &&
      (needs.deploy-staging.result == 'success' || (needs.deploy-staging.result == 'skipped' && needs.deploy-db.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      rollback_mode: ${{ steps.test-gate.outputs.rollback_mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for Staging EKS
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      # Tier 1: Critical Path Tests (With Retries to Filter Flakes)
      - name: Run Integration Tests (Tier 1 - With Retries)
        id: integration
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npm run test:integration && exit 0
            echo "Integration attempt $i failed. Retrying in 5s..."
            sleep 5
          done
          exit 1

      - name: Run Smoke Tests (Tier 1 - With Retries)
        id: smoke
        if: steps.integration.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npm run test:smoke && exit 0
            echo "Smoke attempt $i failed. Retrying in 5s..."
            sleep 5
          done
          exit 1

      # Tier 2: Full Suite (Rerun Tests First; Do Not Auto-Rollback Cluster)
      - name: Run E2E Tests (Tier 2)
        id: e2e
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: npm run test:e2e

      - name: Run Performance Tests (Tier 2)
        id: perf
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        run: npm run test:performance

      - name: Run Regression Tests (Tier 2)
        id: regression
        if: steps.perf.outcome == 'success'
        continue-on-error: true
        run: npm run test:regression

      - name: Evaluate Test Suite & Rollback Mode
        id: test-gate
        run: |
          if [[ "${{ steps.integration.outcome }}" == "failure" || "${{ steps.smoke.outcome }}" == "failure" ]]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "rollback_mode=gated" >> "$GITHUB_OUTPUT"
            echo "## Staging Tests Failed (Tier 1 Deterministic)" >> "$GITHUB_STEP_SUMMARY"
            echo "Critical Integration/Smoke tests failed after 3 attempts. Routing to **gated** rollback." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.e2e.outcome }}" == "failure" || "${{ steps.perf.outcome }}" == "failure" || "${{ steps.regression.outcome }}" == "failure" ]]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "rollback_mode=none" >> "$GITHUB_OUTPUT"
            echo "## Staging Tests Failed (Tier 2 Suite)" >> "$GITHUB_STEP_SUMMARY"
            echo "E2E/Perf/Regression failed while Tier 1 Smoke tests passed. **Skipping cluster rollback**—investigate and rerun failed jobs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "rollback_mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Jira (Staging Tests Failed)
        if: steps.test-gate.outputs.passed == 'false'
        uses: ./actions/jira-transition@main
        with:
          jira-base-url: ${{ vars.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          source-text: ${{ inputs.jira_issue_key }}
          target-status: "Staging Tests Failed"

      - name: Fail Job on Test Failure
        if: steps.test-gate.outputs.passed == 'false'
        run: exit 1

      - name: Update Jira (Staging Tests Success)
        if: steps.test-gate.outputs.passed == 'true'
        uses: ./actions/jira-transition@main
        with:
          jira-base-url: ${{ vars.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          source-text: ${{ inputs.jira_issue_key }}
          target-status: "Staging Tests Success"

      - name: Promote to Prod (Prepare Release)
        if: steps.test-gate.outputs.passed == 'true'
        run: |
          echo "Verified components (${{ needs.detect-diff.outputs.app_components }}) in Staging and ready for Production release."

  # ============================================================
  # ROLLBACK PATH A: Auto Rollback (Stateless App Code Failure Only)
  # ============================================================
  auto-rollback-staging:
    name: Auto Rollback Staging EKS
    needs: [detect-diff, deploy-staging, staging-tests]
    if: |
      always() &&
      needs.detect-diff.outputs.app_components != '[]' &&
      (needs.deploy-staging.outputs.rollback_mode == 'auto' || needs.staging-tests.outputs.rollback_mode == 'auto')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Immediate App Rollback
        run: |
          echo "NOTE: DB migrations are NOT rolled back (Expand/Contract compatibility assumed)."
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

          COMPONENTS=$(echo '${{ needs.detect-diff.outputs.app_components }}' | jq -r '.[]')
          for COMP in $COMPONENTS; do
            echo "Executing Auto-Rollback for deployment/${COMP}..."
            kubectl rollout undo "deployment/${COMP}" -n "${K8S_NAMESPACE}"
            kubectl rollout status "deployment/${COMP}" -n "${K8S_NAMESPACE}" --timeout=180s
          done

      - name: Update Jira (Staging Rolled Back)
        uses: ./actions/jira-transition@main
        with:
          jira-base-url: ${{ vars.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          source-text: ${{ inputs.jira_issue_key }}
          target-status: "Staging Rolled Back"

  # ============================================================
  # ROLLBACK PATH B: Gated Rollback (DB Migration Ran or Tier 1 Test Failure)
  # ============================================================
  gated-rollback-staging:
    name: Gated Rollback Staging EKS (Approval Required)
    needs: [detect-diff, deploy-staging, staging-tests]
    if: |
      always() &&
      needs.detect-diff.outputs.app_components != '[]' &&
      (needs.deploy-staging.outputs.rollback_mode == 'gated' || needs.staging-tests.outputs.rollback_mode == 'gated')
    runs-on: ubuntu-latest
    environment:
      name: staging-rollback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Approved App Rollback
        run: |
          echo "Human approval granted. NOTE: DB migrations are NOT rolled back (Expand/Contract compatibility assumed)."
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

          COMPONENTS=$(echo '${{ needs.detect-diff.outputs.app_components }}' | jq -r '.[]')
          for COMP in $COMPONENTS; do
            echo "Rolling back deployment/${COMP}..."
            kubectl rollout undo "deployment/${COMP}" -n "${K8S_NAMESPACE}"
            kubectl rollout status "deployment/${COMP}" -n "${K8S_NAMESPACE}" --timeout=180s
          done

      - name: Update Jira (Staging Rolled Back)
        uses: ./actions/jira-transition@main
        with:
          jira-base-url: ${{ vars.JIRA_BASE_URL }}
          jira-user-email: ${{ secrets.JIRA_USER_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
          source-text: ${{ inputs.jira_issue_key }}
          target-status: "Staging Rolled Back"
