name: Dev CD Pipeline (GitOps State Update)

on:
  repository_dispatch:
    types: [deploy-to-dev]

jobs:
  update-dev-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits back to the repo
    
    steps:
      - name: Checkout CD Repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Update Dev Kustomize Manifests
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          DOCKERHUB_USER: YOUR_DOCKERHUB_USERNAME # Replace this
        run: |
          echo "Updating Dev overlay with image tag: $IMAGE_TAG"
          cd k8s/overlays/dev
          
          # 1. Update the image SHA
          kustomize edit set image placeholder-app=$DOCKERHUB_USER/hello-app:$IMAGE_TAG
          
          # 2. Update the APP_VERSION in the ConfigMap
          kustomize edit add configmap hello-app-config --behavior=replace --from-literal=APP_VERSION=$IMAGE_TAG
          
      - name: Commit and Push Changes
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "Automated Deploy to Dev: $IMAGE_TAG"
          git push origin main