name: Dev CD Pipeline (Deploy & Update)

on:
  workflow_call:
    inputs:
      base_version:
        description: "The semantic version base (e.g., v1.3.0)"
        required: true
        type: string
      component:
        description: "The name of the component (e.g., backend)"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      CI_APP_ID:
        required: true
      CI_APP_PRIVATE_KEY:
        required: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment: 
      name: dev
    #timeout-minutes: 5
    
    steps:
      - name: Generate CD Repo Token
        id: cd-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ci-cd

      - name: Checkout CD Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ci-cd
          token: ${{ steps.cd-token.outputs.token }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Update Dev Kustomize Manifests
        id: update_kustomize_manifest
        env:
          BASE_VERSION: ${{ inputs.base_version }}
          COMPONENT: ${{ inputs.component }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Dynamically grab the first 7 characters of the my-app-code commit SHA
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_TAG="${BASE_VERSION}-sha-${SHORT_SHA}"
          
          echo "Updating Dev overlay for $COMPONENT with tag: $FULL_TAG"
          cd k8s/overlays/dev
          
          # 1. Set the new image
          kustomize edit set image $COMPONENT=$DOCKERHUB_USER/$COMPONENT:$FULL_TAG
          
          # 2. Safely delete old ConfigMap generation
          yq -i 'del(.configMapGenerator[] | select(.name == "'${COMPONENT}'-config"))' kustomization.yaml || true
          
          # 3. Add new ConfigMap generation
          kustomize edit add configmap ${COMPONENT}-config --from-literal=APP_VERSION="${COMPONENT}-${FULL_TAG}"
          
          #echo "--- VERIFYING GENERATED KUSTOMIZE MANIFEST ---"
          #kustomize build .

      - name: Commit and Push Changes
        if: steps.update_kustomize_manifest.outcome == 'success'
        env:
          COMPONENT: ${{ inputs.component }}
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "Automated Deploy to Dev: $IMAGE_TAG"
          git push origin main
          # Add PR to make the push

      - name: Rollback on failure
        if: always() && (steps.update_kustomize_manifest.outcome == 'failure' || steps.update_kustomize_manifest.outcome == 'cancelled')
        run: |
          echo "Deployment failed health check! Rolling back cluster to previous version..."
          exit 1
          #env:
          #COMPONENT: ${{ github.event.client_payload.component }}
        #run: |
          #echo "Deployment failed health check! Rolling back cluster to previous version..."
          #kubectl rollout undo deployment/${COMPONENT} -n dev

        - name: Deploy to Kubernetes Cluster
        id: deploy
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          if [ "$COMPONENT" == "db-migrations" ]; then
            echo "Running DB migration Job in dev..."
            kubectl delete job db-migrations -n dev --ignore-not-found=true
            kubectl apply -k k8s/overlays/dev
            kubectl wait --for=condition=complete job/db-migrations -n dev --timeout=120s
          else
            echo "Deploying application: $COMPONENT to dev..."
            kubectl apply -k k8s/overlays/dev
            kubectl rollout status "deployment/${COMPONENT}" -n dev --timeout=90s
          fi

      - name: Commit and Push Changes
        if: success()
        env:
          COMPONENT: ${{ inputs.component }}
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_TAG="${BASE_VERSION}-sha-${SHORT_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "Automated Deploy to Dev: ${COMPONENT} (${FULL_TAG})"
          git push origin main

