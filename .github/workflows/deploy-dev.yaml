name: Dev CD Pipeline (GitOps State Update)

on:
  repository_dispatch:
    types: [deploy-to-dev]

jobs:
  update-dev-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits back to the repo
    
    steps:
      - name: Checkout CD Repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.0.0"

      - name: Update Dev Kustomize Manifests
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          # This line is currently missing in your file:
          COMPONENT: ${{ github.event.client_payload.component }}
          DOCKERHUB_USER: YOUR_DOCKERHUB_USERNAME 
        run: |
          echo "Updating Dev overlay for $COMPONENT with tag: $IMAGE_TAG"
          cd k8s/overlays/dev
          
          kustomize edit set image $COMPONENT=$DOCKERHUB_USER/$COMPONENT:$IMAGE_TAG
          kustomize edit remove configmap ${COMPONENT}-config || true
          kustomize edit add configmap ${COMPONENT}-config --behavior=replace --from-literal=APP_VERSION="${COMPONENT}-${IMAGE_TAG}"
          
      - name: Commit and Push Changes
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "Automated Deploy to Dev: $IMAGE_TAG"
          git push origin main

