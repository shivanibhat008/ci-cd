# Attaches the AWS IAM Role for Service Accounts (IRSA) to the Fluentd ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd-service-account
  namespace: amazon-cloudwatch
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/fluentd-prod-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-agent-service-account
  namespace: amazon-cloudwatch
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/cw-agent-prod-role
