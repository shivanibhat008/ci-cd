apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../base/backend
- ../../base/db-migration
- ../../base/frontend
# The GitHub Actions pipeline will dynamically overwrite 
# 'YOUR-DOCKER-USERNAME' and 'LATEST-TAG' during the CD run.
images:
- name: backend
  newName: bhatshivani/backend
  newTag: v1.3.0-sha-915b450
configMapGenerator:
- behavior: replace
  literals:
  - APP_VERSION=backend-v1.3.0-sha-915b450
  name: backend-config

