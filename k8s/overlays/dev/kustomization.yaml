apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../base/backend
# The GitHub Actions pipeline will dynamically overwrite 
# 'YOUR-DOCKER-USERNAME' and 'LATEST-TAG' during the CD run.
images:
- name: backend
  newName: bhatshivani/backend
  newTag: v2.0.0-sha-920ba50
configMapGenerator:
- literals:
  - APP_VERSION=backend-v2.0.0-sha-920ba50
  name: backend-config
