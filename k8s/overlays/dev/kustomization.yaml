apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev

resources:
  - ../../base/backend
images:
  - name: backend
    # The GitHub Actions pipeline will dynamically overwrite 
    # 'YOUR-DOCKER-USERNAME' and 'LATEST-TAG' during the CD run.
    newName: YOUR-DOCKER-USERNAME/backend
    newTag: LATEST-TAG

configMapGenerator: []
